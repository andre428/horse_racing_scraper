[build-system]
requires = ["hatchling >= 1.28.0"]
build-backend = "hatchling.build"

[project]
name = "Horse Racing Data Mixer"
version = "0.3.0"
description = "Horse racing data scraper with Django integration"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "zaafiel428", email = "rzuckasto@gmail.com" },
]
keywords = ["scraper", "horseracing", "etl", "django"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django :: 5.0",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

# Core dependencies for scraping
dependencies = [
    "playwright>=1.57.0",
    "requests>=2.32.5",
    "beautifulsoup4 >=4.14.3",
]

[project.optional-dependencies]
# Django integration (optional - for when you deploy with Django)
django = [
    "django>=5.2.9",
    "psycopg2-binary>=2.9.10", # PostgreSQL adapter
]

# Development tools
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.0",
    "ruff >= 0.14.9",
    "basedpyright>=1.36.0",
    "ipython>=9.8.0", # Better REPL
]

# All extras for complete dev environment
all = [
    "koniki-scraper[django,dev]",
]

[project.urls]
Homepage = "https://github.com/yourusername/koniki-scraper"
Documentation = "https://github.com/yourusername/koniki-scraper#readme"
Repository = "https://github.com/yourusername/koniki-scraper"
Issues = "https://github.com/yourusername/koniki-scraper/issues"

# ============================================================================
# Hatchling Configuration
# ============================================================================
[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.hatch.build.targets.sdist]
include = [
    "/scraper",
    "/tests",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "/.git",
    "/.venv",
    "/.pytest_cache",
    "/.ruff_cache",
    "/dist",
    "/build",
    "**/__pycache__",
    "**/*.pyc",
]

# ============================================================================
# Ruff Configuration
# ============================================================================
[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4

extend-exclude = [
    "migrations",
    "cache",
    "*.db",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "B", # flake8-bugbear
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "S", # flake8-bandit (security)
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "RET", # flake8-return
    "SIM", # flake8-simplify
]

ignore = [
    "E501", # Line too long (formatter handles)
    "S101", # Assert usage (OK in tests)
    "T201", # Print statements (OK for now, migrate to logging later)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "T201"]
"*/migrations/*" = ["E501", "N806"]
"test_*.py" = ["S101", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["racing", "scraper", "config"]
combine-as-imports = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 10

# ============================================================================
# Basedpyright Configuration
# ============================================================================
[tool.basedpyright]
pythonVersion = "3.13"  # Minimum supported
typeCheckingMode = "standard"

# Include patterns
include = ["scraper", "tests", "test_pipeline.py"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/venv",
    "**/.pytest_cache",
    "**/build",
    "**/dist",
    "**/cache",
]

reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportGeneralTypeIssues = true
reportOptionalMemberAccess = "warning"
reportUnknownMemberType = "warning"

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-ra", # Show summary of all test outcomes
    "--strict-markers", # Error on unknown markers
    "--strict-config", # Error on config issues
    "-v", # Verbose output
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_network: marks tests requiring internet",
    "requires_playwright: marks tests requiring browser",
]

asyncio_mode = "auto"

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["scraper"]
omit = [
    "*/tests/*",
    "**/test_*.py",
    "**/__pycache__/*",
    "**/conftest.py",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
]

# ============================================================================
# Django Configuration (for when integrated)
# ============================================================================
# Uncomment and configure when setting up Django project
# [tool.django]
# settings_module = "your_project.settings"