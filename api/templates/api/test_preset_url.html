<!DOCTYPE html>
<html>
<head>
    <title>Test Preset URL</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ddd; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>Preset URL Tester</h1>
    <p>This will test which URL path works for your preset endpoints.</p>
    
    <button onclick="testUrls()">Run Tests</button>
    
    <div id="results"></div>
    
    <script>
    async function testUrls() {
        const results = document.getElementById('results');
        results.innerHTML = '<p>Testing...</p>';
        
        const urlsToTest = [
            '/preset/1/',
            '/api/preset/1/',
            '/scraper/preset/1/',
        ];
        
        let html = '';
        
        for (const url of urlsToTest) {
            try {
                const response = await fetch(url);
                const contentType = response.headers.get('content-type');
                
                if (response.ok && contentType && contentType.includes('application/json')) {
                    const data = await response.json();
                    html += `<div class="test success">
                        <strong>✅ SUCCESS: ${url}</strong><br>
                        Status: ${response.status}<br>
                        Data: ${JSON.stringify(data, null, 2)}
                    </div>`;
                } else {
                    const text = await response.text();
                    html += `<div class="test error">
                        <strong>❌ FAILED: ${url}</strong><br>
                        Status: ${response.status}<br>
                        Content-Type: ${contentType}<br>
                        Response: ${text.substring(0, 200)}...
                    </div>`;
                }
            } catch (error) {
                html += `<div class="test error">
                    <strong>❌ ERROR: ${url}</strong><br>
                    Error: ${error.message}
                </div>`;
            }
        }
        
        results.innerHTML = html;
    }
    </script>
</body>
</html>
