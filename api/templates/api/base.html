{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Racing Data Hub{% endblock %}</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'api/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'api/css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'api/css/components.css' %}">
    <link rel="stylesheet" href="{% static 'api/css/pages.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/api/" class="navbar-brand">
                <i class="fas fa-horse"></i>
                Racing Data Hub
            </a>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="/api/" class="nav-link" data-tooltip="Uruchom skaner danych wyścigowych">
                        <i class="fas fa-play"></i>
                        <span>Skaner</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/api/database/" class="nav-link" data-tooltip="Zarządzaj bazami danych">
                        <i class="fas fa-database"></i>
                        <span>Bazy Danych</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/api/browse/" class="nav-link" data-tooltip="Przeglądaj zebrane dane">
                        <i class="fas fa-search"></i>
                        <span>Przeglądaj</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/api/reports/" class="nav-link" data-tooltip="Generuj raporty i analizy">
                        <i class="fas fa-chart-bar"></i>
                        <span>Raporty</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Breadcrumbs -->
    {% block breadcrumbs %}{% endblock %}

    <!-- Main Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Core JavaScript -->
    <script src="{% static 'api/js/utils.js' %}"></script>
    <script src="{% static 'api/js/api.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
